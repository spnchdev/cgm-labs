<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Lab 8 — Projection Shadows (Shadow Mapping)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar">
        <div class="control-group">
            <label class="toggle-chip"><input type="checkbox" id="shadowsToggle" checked> Shadows</label>
            <label class="toggle-chip"><input type="checkbox" id="orbitLightToggle"> Orbit Light</label>
        </div>

        <div class="control-group">
            <label for="opacitySlider">Shadow Opacity:</label>
            <input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="0.58">
            <span id="opacityValue" class="value-badge">0.58</span>
        </div>

        <div class="control-group">
            <label for="camAngleSlider">Camera Yaw:</label>
            <input id="camAngleSlider" type="range" min="-180" max="180" step="2" value="32">
            <span id="camAngleValue" class="value-badge">32°</span>
        </div>

        <button type="button" id="resetBtn" class="primary-btn">Reset</button>
    </header>

    <section class="toolbar secondary-toolbar" aria-label="Light source position">
        <div class="control-group">
            <label for="lightXSlider">Light X:</label>
            <input id="lightXSlider" type="range" min="-5" max="5" step="0.1" value="2.8">
            <span id="lightXValue" class="value-badge">2.8</span>
        </div>

        <div class="control-group">
            <label for="lightYSlider">Light Y:</label>
            <input id="lightYSlider" type="range" min="1.5" max="6.5" step="0.1" value="3.8">
            <span id="lightYValue" class="value-badge">3.8</span>
        </div>

        <div class="control-group">
            <label for="lightZSlider">Light Z:</label>
            <input id="lightZSlider" type="range" min="-5" max="5" step="0.1" value="2.4">
            <span id="lightZValue" class="value-badge">2.4</span>
        </div>
    </section>

    <canvas id="glcanvas" width="640" height="640"></canvas>

    <p id="statusHint" class="status-hint"></p>

    <script type="module" src="main.js"></script>
</body>
</html>
